[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
shared-kernel = { path = "crates/shared-kernel" }
ordering = { path = "crates/ordering" }
billing = { path = "crates/billing" }
proptest = "1"

# --- domain-powers quality configuration (skills/quality-gates/languages/rust/Cargo-template.toml) ---

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
as_conversions = "warn"
indexing_slicing = "warn"
wildcard_enum_match_arm = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.metadata.domain-powers]
contexts = ["ordering", "billing"]
shared = ["shared_kernel"]
public_module = "api"
domain_forbidden = []
