# --- domain-powers quality configuration: merge into pyproject.toml ---
# Replace "shop" and the context names with your own.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",     # pycodestyle, pyflakes
  "I",               # isort
  "B",               # bugbear
  "UP",              # pyupgrade
  "ANN",             # annotations required (ANN401: no Any)
  "PGH",             # PGH003: no blanket type: ignore
  "FBT",             # boolean trap (flags → enums / separate methods)
  "PLR2004",         # magic values → named constants / value objects
  "RET", "SIM", "PT", "RUF",
  "S",               # security basics
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["shop"]
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "possibly-undefined",
  "unused-awaitable",
  "explicit-override",
]
disallow_any_explicit = true
disallow_any_unimported = true

# Brownfield only: relax listed legacy modules. This list may only shrink.
# [[tool.mypy.overrides]]
# module = ["shop.legacy.*"]
# strict = false
# disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.importlinter]
root_package = "shop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "context layers"
type = "layers"
containers = ["shop.ordering", "shop.billing"]
layers = ["(infrastructure)", "(api)", "(application)", "domain"]  # (x) = optional layer

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["shop.ordering.domain", "shop.billing.domain"]
forbidden_modules = ["sqlalchemy", "django", "fastapi", "flask", "pydantic", "requests", "httpx", "boto3"]
# forbidden_modules must be installed for import-linter to resolve them;
# drop any your project doesn't depend on.

[[tool.importlinter.contracts]]
name = "ordering reaches billing only via api"
type = "forbidden"
source_modules = ["shop.ordering"]
forbidden_modules = ["shop.billing.domain", "shop.billing.application", "shop.billing.infrastructure"]

[[tool.importlinter.contracts]]
name = "billing reaches ordering only via api"
type = "forbidden"
source_modules = ["shop.billing"]
forbidden_modules = ["shop.ordering.domain", "shop.ordering.application", "shop.ordering.infrastructure"]

[tool.domain-powers]
root_package = "shop"
source_root = "src"
contexts = ["ordering", "billing"]
shared = ["shared_kernel"]
public_module = "api"
domain_forbidden = []
